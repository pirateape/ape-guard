name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-homebrew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Homebrew tap
        uses: actions/checkout@v6
        with:
          repository: pirateape/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Get release assets
        id: get_assets
        run: |
          # Download the source tarball
          curl -sL "https://github.com/pirateape/ape-guard/archive/refs/tags/${{ github.ref_name }}.tar.gz" -o source.tar.gz
          SHA=$(shasum -a 256 source.tar.gz | cut -d' ' -f1)
          echo "sha256=$SHA" >> $GITHUB_OUTPUT

      - name: Update formula
        run: |
          cd homebrew-tap
          # Update version and SHA256 in the formula
          sed -i "s/version \".*\"/version \"${{ github.ref_name }}\"/" Formula/apeguard.rb
          sed -i "s/sha256 \".*\"/sha256 \"${{ steps.get_assets.outputs.sha256 }}\"/" Formula/apeguard.rb
          
          # Also update Checkov and Syft dependencies if they're in the formula
          if grep -q "checkov" Formula/apeguard.rb; then
            echo "Checkov dependency already present"
          else
            echo "Adding Checkov and Syft dependencies"
            # This would be more complex - better to have them already in the formula
          fi

      - name: Commit and push changes
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/apeguard.rb
          git commit -m "Update apeguard to ${{ github.ref_name }}"
          git push origin main