name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Awarnings
  BINARY_NAME: apeguard

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1.91.1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version =' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "✅ Tag v$CARGO_VERSION matches Cargo.toml"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}${{ matrix.suffix }}" "dist/${BINARY_NAME}-${{ matrix.target }}${{ matrix.suffix }}"
          # Generate per-binary checksum
          sha256sum "dist/${BINARY_NAME}-${{ matrix.target }}${{ matrix.suffix }}" > "dist/${BINARY_NAME}-${{ matrix.target }}${{ matrix.suffix }}.sha256"

      - name: Sign binary (Linux only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor "dist/${BINARY_NAME}-${{ matrix.target }}${{ matrix.suffix }}"
            echo "✅ Binary signed with GPG"
          else
            echo "⚠️ GPG_PRIVATE_KEY not set — skipping signature"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create GitHub release
      attestations: write # needed for provenance attestation
      id-token: write # needed for OIDC token (attest-build-provenance)

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Generate combined checksums
        run: |
          find artifacts -type f -name '*.sha256' -exec cat {} \; | sort > artifacts/checksums.txt
          find artifacts -type f ! -name '*.sha256' -exec sha256sum {} \; | sort >> artifacts/checksums.txt

      - name: Generate GPG signature of checksums
        shell: bash
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --batch --import
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor artifacts/checksums.txt
            echo "✅ Checksums signed with GPG"
          else
            echo "⚠️ GPG_PRIVATE_KEY not set — skipping signature"
          fi

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "artifacts/**/apeguard-*"
          subject-name: apeguard

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Update Homebrew formula
        # The release is already published at this point; a missing/invalid
        # tap token must not mark the whole release run as failed.
        continue-on-error: true
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "⚠️ HOMEBREW_TAP_TOKEN not set — skipping Homebrew tap update (update manually or via update-homebrew-tap.yml)"
            exit 0
          fi
          # Checkout homebrew-tap repo
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/pirateape/homebrew-tap.git homebrew-tap
          cd homebrew-tap

          # Download source tarball and compute SHA256
          curl -sL "https://github.com/pirateape/ape-guard/archive/refs/tags/${{ github.ref_name }}.tar.gz" -o source.tar.gz
          SHA=$(shasum -a 256 source.tar.gz | cut -d' ' -f1)

          # Update version, URL and SHA256 in formula
          sed -i "s/version \".*\"/version \"${{ github.ref_name }}\"/" Formula/apeguard.rb
          sed -i "s|url \".*\"|url \"https://github.com/pirateape/ape-guard/archive/refs/tags/${{ github.ref_name }}.tar.gz\"|" Formula/apeguard.rb
          sed -i "s/sha256 \".*\"/sha256 \"$SHA\"/" Formula/apeguard.rb

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/apeguard.rb
          git commit -m "Update apeguard to ${{ github.ref_name }}"
          git push origin main
