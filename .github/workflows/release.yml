name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Awarnings
  BINARY_NAME: apeguard

jobs:
  build-release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # v1.91.1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Verify tag matches Cargo.toml version
        shell: bash
        run: |
          CARGO_VERSION=$(grep '^version =' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            exit 1
          fi
          echo "✅ Tag v$CARGO_VERSION matches Cargo.toml"

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${BINARY_NAME}${{ matrix.suffix }}" "dist/${BINARY_NAME}-${{ matrix.target }}${{ matrix.suffix }}"
          # Generate per-binary checksum
          sha256sum "dist/${BINARY_NAME}-${{ matrix.target }}${{ matrix.suffix }}" > "dist/${BINARY_NAME}-${{ matrix.target }}${{ matrix.suffix }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*

  create-release:
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create GitHub release
      attestations: write # needed for provenance attestation
      id-token: write # needed for OIDC token (attest-build-provenance)

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Generate combined checksums
        run: |
          find artifacts -type f -name '*.sha256' -exec cat {} \; | sort > artifacts/checksums.txt
          find artifacts -type f ! -name '*.sha256' -exec sha256sum {} \; | sort >> artifacts/checksums.txt

      - name: Generate provenance attestation
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "artifacts/**/apeguard-*"
          subject-name: apeguard

      - name: Create release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Update Homebrew formula
        run: |
          # Checkout homebrew-tap repo
          git clone https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/pirateape/homebrew-tap.git homebrew-tap
          cd homebrew-tap

          # Download source tarball and compute SHA256
          curl -sL "https://github.com/pirateape/ape-guard/archive/refs/tags/${{ github.ref_name }}.tar.gz" -o source.tar.gz
          SHA=$(shasum -a 256 source.tar.gz | cut -d' ' -f1)

          # Update version, URL and SHA256 in formula
          sed -i "s/version \".*\"/version \"${{ github.ref_name }}\"/" Formula/apeguard.rb
          sed -i "s|url \".*\"|url \"https://github.com/pirateape/ape-guard/archive/refs/tags/${{ github.ref_name }}.tar.gz\"|" Formula/apeguard.rb
          sed -i "s/sha256 \".*\"/sha256 \"$SHA\"/" Formula/apeguard.rb

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/apeguard.rb
          git commit -m "Update apeguard to ${{ github.ref_name }}"
          git push origin main
