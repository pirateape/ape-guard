name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal token permissions: read-only by default
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Awarnings

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@fcf8fc78eef17e481e78f2ef6024814dfce3f9aa # stable
        with:
          components: clippy

      - name: Cache dependencies
        uses: Swatinem/rust-cache@9d47c60adf7e97df1cb3f9f15d5a2e25d4af6cfb # v2.7.8

      - name: Build
        run: cargo build --verbose

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test --verbose

  check-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@fcf8fc78eef17e481e78f2ef6024814dfce3f9aa # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check
