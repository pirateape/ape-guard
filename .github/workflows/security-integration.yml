# GitHub Actions Security Integration Workflow
# Integrates ApeGuard Layers 1-12, MCP security scanning, Terraform IaC auditing, and LLM red-teaming
#
# Layers:
#   1: Secrets (Gitleaks + TruffleHog)
#   2: SAST (Semgrep)
#   3: SCA (Trivy vuln + secret + misconfig)
#   4: Container (Trivy image scanning)
#   5: DAST (Nuclei/ZAP) — requires --web target
#   6: IaC (Checkov)
#   7: SBOM (Syft)
#   8: Context Drift (AGENTS.md/CLAUDE.md claim verification)
#   9: MCP Security (Tool poisoning, SSRF, unauth exposure)
#   10: Terraform IaC (Terraform config auditing)
#   11: AWS S3 (S3 bucket permission scanning)
#   12: TLS Certificates (TLS certificate expiry/shadow auditing)
#
# Triggers: push to main, pull_request to main, weekly schedule (Sundays 08:00 UTC)

name: Security Integration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 0"

permissions:
  contents: read
  security-events: write

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  # "stable" — a pinned 1.84 cannot parse newer transitive manifests
  # (e.g. idna_adapter 1.2.2) since Cargo.lock is not committed.
  RUST_VERSION: "stable"

jobs:
  # ─── Core ApeGuard Scan (Layers 1-7 + 8-12) ───
  apeguard-scan:
    name: ApeGuard Full Scan (L1-L12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1.91.1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          profile: minimal
      - name: Install system deps
        run: |
          sudo apt-get update && sudo apt-get install -y \
            openssl libssl-dev pkg-config
      - name: Install scanners
        run: |
          cargo install gitleaks --locked || true
          cargo install trufflehog --locked || true
          cargo install semgrep --locked || true
          cargo install trivy --locked || true
          cargo install syft --locked || true
          cargo install checkov --locked || true
      - name: Build ApeGuard
        run: cargo build --release
      - name: Run ApeGuard scan (Layers 1-7)
        run: |
          cargo run --release -- scan \
            --layers 1,2,3,4,6,7 \
            --format sarif,md,html \
            --output-dir .apeguard/reports-l1-l7
      - name: Run ApeGuard scan (Layers 8-12, opt-in)
        run: |
          cargo run --release -- scan \
            --layers 8,9,10,11,12 \
            --context-drift \
            --format sarif,md \
            --output-dir .apeguard/reports-l8-l12
      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .apeguard/reports-l1-l7/apeguard-report.sarif
          category: apeguard-layers-1-7
      - name: Upload TLS SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .apeguard/reports-l8-l12/apeguard-report.sarif
          category: apeguard-layers-8-12
      - name: Upload reports artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apeguard-reports
          path: .apeguard/reports*
          retention-days: 30

  # ─── MCP Security Scan (Layer 9 standalone) ───
  mcp-scan:
    name: MCP Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install uv (Python package manager)
        uses: astral-sh/setup-uv@v7
      - name: Install snyk-agent-scan (MCP security scanner)
        run: uvx snyk-agent-scan@latest --help || echo "snyk-agent-scan requires SNYK_TOKEN"
      - name: Scan MCP configs for tool poisoning
        run: |
          for conf in ~/.cursor/mcp.json ~/.vscode/mcp.json ~/.claude/mcp.json; do
            if [ -f "$conf" ]; then
              echo "=== Scanning MCP config: $conf ==="
              python3 -c "
              import json, sys
              with open('$conf') as f:
                  cfg = json.load(f)
              tools = cfg.get('mcpServers', {}).get('servers', {}) if isinstance(cfg.get('mcpServers'), dict) else {}
              for name, tool in tools.items():
                  desc = tool.get('description', '') or ''
                  if len(desc) > 500 or '<important>' in desc.lower() or 'do not tell the user' in desc.lower():
                      print(f'POISONING RISK: {name} description={desc[:200]}')
                  else:
                      print(f'OK: {name} ({len(desc)} chars)')
              " 2>&1
            fi
          done
      - name: Run snyk-agent-scan (if SNYK_TOKEN is set)
        if: env.SNYK_TOKEN != ''
        run: uvx snyk-agent-scan@latest ~/.cursor/mcp.json ~/.vscode/mcp.json ~/.claude/mcp.json 2>&1 || echo "snyk-agent-scan completed with warnings"

  # ─── Terraform IaC Audit (Layer 10 standalone) ───
  terraform-audit:
    name: Terraform IaC Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install checkov
        run: pip install checkov
      - name: Run checkov against Terraform configs
        run: |
          for tf_dir in .terraform ../infrastructure ../iac . ../ApeWall ../ArdentKey ../SentinelNet; do
            if [ -d "$tf_dir" ]; then
              echo "=== Terraform audit: $tf_dir ==="
              checkov -d "$tf_dir" --compact --quiet 2>&1 || echo "checkov completed with findings"
            fi
          done
      - name: Fail on critical findings
        run: |
          if grep -q "CRITICAL" /tmp/checkov-output.log 2>/dev/null; then
            echo "CRITICAL findings in Terraform configs"
            exit 1
          fi

  # ─── LLM Red-Team (ArdentKey) ───
  llm-redteam:
    name: LLM Red-Team (ArdentKey)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # NOTE: `secrets` is not allowed in job-level `if:` (GitHub rejects the
    # workflow at parse time -> 0s "workflow file issue"). Gate at step level
    # via job env instead.
    env:
      ARDENTKEY_ENDPOINT: ${{ secrets.ARDENTKEY_ENDPOINT }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run LLM red-team (skipped when ARDENTKEY_ENDPOINT is not configured)
        if: env.ARDENTKEY_ENDPOINT != ''
        run: |
          npm install -g promptfoo
          promptfoo redteam run \
            --target "$ARDENTKEY_ENDPOINT" \
            --fail-on critical \
            --output results.json 2>&1 || echo "red-team completed with findings"
      - name: Upload redteam report
        if: always() && env.ARDENTKEY_ENDPOINT != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redteam-report
          path: results.json
          retention-days: 30

  # ─── AWS S3 Scan (Layer 11 standalone) ───
  aws-s3-scan:
    name: AWS S3 Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # NOTE: `secrets` is not allowed in job-level `if:`; gate at step level.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install AWS CLI and scan S3 buckets (skipped when no AWS credentials)
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip" && unzip awscliv2.zip && sudo ./aws/install
          aws s3api list-buckets --query "Buckets[].{Name:Name,LastModified:LastModified}" --output json
          for bucket in $(aws s3api list-buckets --query "Buckets[].Name" --output text); do
            echo "=== Checking bucket: $bucket ==="
            aws s3api get-bucket-acl --bucket "$bucket" --query "Owner" --output json 2>&1
            aws s3api get-public-access-block --bucket "$bucket" 2>&1 || echo "No public access block configured"
          done

  # ─── TLS Certificate Audit (Layer 12 standalone) ───
  tls-audit:
    name: TLS Certificate Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install openssl
        run: sudo apt-get update && sudo apt-get install -y openssl
      - name: Check local certs for expiry
        run: |
          for cert in /etc/ssl/certs/*.pem /usr/local/etc/ssl/certs/*.pem; do
            if [ -f "$cert" ]; then
              echo "Checking cert: $cert"
              openssl x509 -in "$cert" -noout -dates -subject 2>/dev/null || echo "Invalid cert: $cert"
            fi
          done
      - name: Fail on expired certs
        run: |
          for cert in /etc/ssl/certs/*.pem; do
            if [ -f "$cert" ]; then
              if ! openssl x509 -checkend 0 -in "$cert" -noout 2>/dev/null; then
                echo "CERT EXPIRED: $cert"
                exit 1
              fi
            fi
          done
