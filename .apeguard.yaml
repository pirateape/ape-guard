# ApeGuard Configuration
# Generated by `apeguard init`
# See https://github.com/pirateape/ape-guard for full docs

layers:
- 1
- 2
- 3
severity: all
binaries:
  gitleaks: null
  semgrep: null
  trivy: null
cache:
  enabled: true
  path: .apeguard/cache
  ttl_hours: 24
report:
  formats:
  - md
  types:
  - tech
  - exec
  - roadmap
output_dir: .apeguard/reports

# Scanner layers:
#   1 = Secrets (Gitleaks)
#   2 = SAST (Semgrep)
#   3 = SCA (Trivy vulns)
#   4 = Container (Trivy image)
#   5 = DAST (Nuclei/Zap)
