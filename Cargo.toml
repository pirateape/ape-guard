[package]
name = "apeguard"
version = "0.3.0"
edition = "2021"
description = "One-command security posture assessment — layered scans, zero trust mapping, 3-audience reports"
authors = ["APE-Brain"]
license = "Elastic-2.0"
repository = "https://github.com/apeguard/cli"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"

# Async / Concurrency
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json"] }

# Utilities
which = "6.0"
regex = "1"

# Cache
rusqlite = { version = "0.31", features = ["bundled"] }

# Templates
tera = "1"

# Logging / Output
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
glob = "0.3"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
strip = "symbols"
